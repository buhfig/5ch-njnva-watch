name: Watch 5ch thread

on:
  workflow_dispatch:
  schedule:
    # JST 09:05, 15:05, 21:05
    - cron: '5 0,6,12 * * *'

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and convert dat
        run: python watch.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.txt data/*.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update watched thread data"
            git push
          fi
