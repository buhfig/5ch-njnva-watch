name: Watch 5ch thread

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger context
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "default_branch=${{ github.event.repository.default_branch }}"
          date -u

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and convert NVA dat
        run: python watch.py

      - name: Fetch and convert AI chat dat
        if: always()
        run: python watch_ai.py

      - name: Commit data files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ data2/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update watched thread data"
            git push
          fi
      - name: Debug timing
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "run_id=${{ github.run_id }}"
          echo "utc_now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "jst_now=$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"
