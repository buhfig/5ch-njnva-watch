name: Watch 5ch thread

on:
  workflow_dispatch:
  schedule:
  # JST 00:54
  - cron: '54 15 * * *'

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and convert dat
        run: python watch.py

      - name: Commit data files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update watched thread data"
            git push
          fi
